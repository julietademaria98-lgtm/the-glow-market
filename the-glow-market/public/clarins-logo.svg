<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <!-- Clarins Paris logo -->
  <g fill="#E0003C">
    <!-- Top arc -->
    <path d="M 20 48 Q 140 -8 260 48" stroke="#E0003C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- Bottom arc -->
    <path d="M 20 72 Q 140 128 260 72" stroke="#E0003C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- CLARINS text -->
    <text x="140" y="66" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="40" font-weight="700" letter-spacing="6" fill="#E0003C">CLARINS</text>
    <!-- PARIS text -->
    <text x="140" y="86" text-anchor="middle" font-family="Times New Roman, Georgia, serif" font-size="14" font-weight="400" letter-spacing="8" fill="#E0003C">PARIS</text>
  </g>
</svg>
